<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>Bao’en Temple</title>
<style>
:root{--glass:rgba(70,105,150,.5);--bar:rgba(30,30,30,.55);--ink:#fff;box-sizing:border-box}

:root[data-theme="dark"]{--glass:rgba(40,60,95,.6);--bar:rgba(10,10,10,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#222;font-family:"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC","Microsoft JhengHei","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;touch-action:none}
.pill{position:fixed;display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:30px;background:var(--glass);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill button,.pill select{background:none;border:0;color:var(--ink);font:inherit;font-size:20px;padding:4px;cursor:pointer}
#tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;gap:10px;padding:10px 14px}
#tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;gap:10px;padding:10px 14px}
#tl b{font-size:24px}
#tl select{font-size:22px;font-weight:700;appearance:none;-webkit-appearance:none}
#tl select option{color:#000}
#rice{position:relative;font-size:26px}
#rice i{position:absolute;right:-8px;top:-6px;font:600 11px/1 sans-serif;background:#c0392b;border-radius:9px;padding:2px 5px}
#chant{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 76px);padding:12px 22px;border-radius:26px;border:1px solid rgba(255,255,255,.3);background:var(--bar);color:var(--ink);font-size:18px;cursor:pointer}
#conn{top:calc(env(safe-area-inset-top,0px) + 128px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:16px;transition:opacity .6s}
#conn a{margin-left:14px;cursor:pointer;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);padding:8px 18px;border-radius:20px;background:var(--bar);font-size:16px;opacity:0;transition:opacity .4s;white-space:nowrap}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;right:12px;justify-content:space-around;gap:0;background:var(--bar);padding:8px 6px}
#bar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:17px;padding:6px 14px}
#bar button span{font-size:28px;line-height:1}
#bar em{font-style:normal;white-space:nowrap}
#lang{font-size:16px!important;white-space:nowrap}
#bar button:disabled{opacity:.45}
</style></head>

<div id="c"></div>

<button data-a="beads"><span>📿</span><em data-k="beads"></em></button></div>

const legs=[-.22,.22].map(x=>{const g=new THREE.Group();g.position.set(x,.2,0);mk.add(g);box(.32,.16,.55,0x3a2f28,0,-.12,-.1,g);return g});
const B=new THREE.Group();B.position.set(0,.85,0);mk.add(B);
B.add(lat([[.46,0],[.47,.3],[.41,.7],[.3,.95],[.2,1.05],[.001,1.05]],0xb5c9d4));
box(.5,1.1,.06,0xf0d878,.05,.5,.44,B).rotation.z=.45;
add(new THREE.TorusGeometry(.3,.045,6,18),mt(0x6b3f22),0,1,0,B).rotation.x=Math.PI/2;
sph(.5,0xe9bb8c,0,1.5,0,B,.95);
for(const s of[-1,1]){sph(.09,0xe9bb8c,s*.5,1.5,0,B);sph(.05,0x2a2220,s*.17,1.52,-.465,B);sph(.07,0xf0a090,s*.28,1.4,-.42,B)}
const arms=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.52,.9,0);B.add(g);add(new THREE.CylinderGeometry(.13,.22,.75,10),mt(0xc9d8e0),0,-.4,0,g);sph(.12,0xe9bb8c,0,-.82,0,g);return g});
mk.scale.setScalar(.6);
// audio
let AC,master,muted=false,chant=null;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,d,type,v){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start();o.stop(t+d)}catch(e){}}
function toggleChant(){try{if(chant){chant.forEach(o=>o.stop());chant=null;return false}const a=ac(),g=a.createGain();g.gain.value=.1;g.connect(master);
const l=a.createOscillator(),lg=a.createGain();l.frequency.value=.35;lg.gain.value=.06;l.connect(lg);lg.connect(g.gain);l.start();
chant=[110,165,220.5].map(f=>{const o=a.createOscillator();o.frequency.value=f;o.connect(g);o.start();return o});chant.push(l);return true}catch(e){return false}}
// i18n
const L=['zh-Hant','zh-Hans','en'];
const D={
'zh-Hant':{title:'報恩寺，稍作歇息',srv:'報恩寺',chant:'聆聽誦經',chantOff:'關閉誦經',conn1:'正在連線報恩寺…',conn2:'已連線報恩寺',pick:'選擇伺服器',palm:'合掌',bow:'禮拜',wood:'木魚',beads:'念珠',palmMsg:'凝神靜心',bowN:n=>'禮拜 '+n+' 拜',woodMsg:'篤篤篤篤',beadsN:n=>'念珠 '+n+' 顆',soon:'敬請期待',exit:'離開',sound:'聲音',theme:'深淺色',lang:'語言'},
'zh-Hans':{title:'报恩寺，稍作歇息',srv:'报恩寺',chant:'聆听诵经',chantOff:'关闭诵经',conn1:'正在连接报恩寺…',conn2:'已连接报恩寺',pick:'选择服务器',palm:'合掌',bow:'礼拜',wood:'木鱼',beads:'念珠',palmMsg:'凝神静心',bowN:n=>'礼拜 '+n+' 拜',woodMsg:'笃笃笃笃',beadsN:n=>'念珠 '+n+' 颗',soon:'敬请期待',exit:'离开',sound:'声音',theme:'深浅色',lang:'语言'},
'en':{title:'Bao’en Temple, a Quiet Pause',srv:'Bao’en',chant:'Listen to chanting',chantOff:'Stop chanting',conn1:'Connecting to Bao’en Temple…',conn2:'Connected to Bao’en Temple',pick:'Choose server',palm:'Pray',bow:'Bow',wood:'Woodfish',beads:'Beads',palmMsg:'Calm the mind',bowN:n=>'Bow no. '+n,woodMsg:'Tok tok tok',beadsN:n=>n+' beads',soon:'Coming soon',exit:'Exit',sound:'Sound',theme:'Light / dark',lang:'Language'}};
const n0=(navigator.language||'en').toLowerCase();
let li=n0.startsWith('zh')?(/tw|hk|mo|hant/.test(n0)?0:1):2,conn=0;
const T=(k,n)=>{const v=D[L[li]][k];return typeof v==='function'?v(n):v};
function applyLang(){const d=D[L[li]];document.documentElement.lang=L[li];document.title=d.title;
const s=$('srv'),i=Math.max(0,s.selectedIndex);s.innerHTML=[1,2,3].map(n=>'<option>'+d.srv+' '+n+'</option>').join('');s.selectedIndex=i;
$('chant').textContent=chant?d.chantOff:d.chant;$('ctxt').textContent=conn?d.conn2:d.conn1;$('pick').textContent=d.pick;
document.querySelectorAll('#bar em').forEach(e=>e.textContent=d[e.dataset.k]);
$('exit').title=d.exit;$('mute').title=d.sound;$('set').title=d.theme;$('lang').title=d.lang;$('lang').textContent='🌐 '+['繁','简','EN'][li]}
// UI
let merit=0,bows=0,beads=0,tt;
$('lang').onclick=()=>{li=(li+1)%3;applyLang()};
applyLang();
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1800)}
function gain(){$('cnt').textContent=++merit}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:1};
$('chant').onclick=()=>{toggleChant();applyLang()};
$('set').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};

function cycle(){const s=$('srv');s.selectedIndex=(s.selectedIndex+1)%s.options.length}
$('pick').onclick=cycle;
setTimeout(()=>{conn=1;applyLang();$('pick').style.display='none'},2200);
setTimeout(()=>$('conn').style.opacity=0,4200);
// actions
let act=null;
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{if(act)return;ac();const n=b.dataset.a;act={n,t:0,last:-1,dur:{palm:2,bow:3,wood:3,beads:3}[n]};
if(n==='palm')toast(T('palmMsg'));if(n==='bow'){bows++;toast(T('bowN',bows));tone(660,640,2.2,'sine',.25)}});
// input
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=null,jx=0,jy=0;
R.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};R.domElement.setPointerCapture(e.pointerId)});
R.domElement.addEventListener('pointermove',e=>{if(!drag)return;jx=Math.max(-1,Math.min(1,(e.clientX-drag.x)/60));jy=Math.max(-1,Math.min(1,(e.clientY-drag.y)/60))});
const end=()=>{drag=null;jx=jy=0};R.domElement.addEventListener('pointerup',end);R.domElement.addEventListener('pointercancel',end);
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;R.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()});
// loop
let last=performance.now(),walk=0,ang=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
let vx=jx+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),vz=jy+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
const mag=Math.hypot(vx,vz),moving=!act&&mag>.15;
if(moving){const n=Math.min(mag,1),sp=6*n;vx/=mag;vz/=mag;{const x0=mk.position.x,z0=mk.position.z;let nx=Math.max(-90,Math.min(90,x0+vx*sp*dt)),nz=Math.min(90,z0+vz*sp*dt);if(!ok(nx,nz)){if(ok(nx,z0))nz=z0;else if(ok(x0,nz))nx=x0;else{nx=x0;nz=z0}}mk.position.x=nx;mk.position.z=nz;mk.position.y=yAt(nz)}
let d=Math.atan2(-vx,-vz)-ang;d=Math.atan2(Math.sin(d),Math.cos(d));ang+=d*Math.min(1,dt*10);mk.rotation.y=ang;walk+=dt*10}
else walk*=.9;
{const dd=Math.hypot(mk.position.x,mk.position.z+31);doorOpen+=((dd<8?1:0)-doorOpen)*Math.min(1,dt*3);for(const l of leaves)l[0].rotation.y=l[1]*1.5*doorOpen}
const sw=Math.sin(walk)*(moving?.6:0);legs[0].rotation.x=sw;legs[1].rotation.x=-sw;
B.rotation.x=0;B.position.y=.85+Math.abs(Math.sin(walk))*(moving?.06:0);
arms[0].rotation.set(-sw*.7,0,.08);arms[1].rotation.set(sw*.7,0,-.08);
if(act){act.t+=dt;const t=act.t,k=Math.max(0,Math.min(1,t/.4,(act.dur-t)/.4));
if(act.n==='palm'||act.n==='bow'){arms[0].rotation.set(1.3*k,0,.7*k);arms[1].rotation.set(1.3*k,0,-.7*k);
if(act.n==='bow')B.rotation.x=-Math.sin(Math.PI*t/act.dur)*1.1}
if(act.n==='wood'){const s=Math.floor(t/.5),ph=(t%.5)/.5,dip=Math.max(0,1-ph*4);
arms[0].rotation.set(.9*k,0,.55*k);arms[1].rotation.set((1.25-.45*dip)*k,0,-.55*k);
if(s!==act.last){act.last=s;tone(520,260,.18,'triangle',.5);gain();if(!s)toast(T('woodMsg'))}}
if(act.n==='beads'){const s=Math.floor(t/.45);arms[0].rotation.set(1*k,0,.6*k);arms[1].rotation.set((1+.12*Math.sin(t*14))*k,0,-.6*k);
if(s!==act.last){act.last=s;tone(1800,1200,.05,'square',.08);if(++beads%10===0)toast(T('beadsN',beads))}}
if(t>=act.dur){if(act.n==='palm'||act.n==='bow')gain();act=null}}
cam.position.lerp(new THREE.Vector3(mk.position.x,3.4+mk.position.y,mk.position.z+6.5),Math.min(1,dt*5));
cam.lookAt(mk.position.x,1.3+mk.position.y,mk.position.z-4);sun.position.set(mk.position.x-10,18,mk.position.z+8);sun.target.position.set(mk.position.x,0,mk.position.z);
R.render(S,cam)}
requestAnimationFrame(frame);
